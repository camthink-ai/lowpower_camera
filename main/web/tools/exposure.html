<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NE101 手动曝光调节</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 680px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input[type=range] { width: 100%; }
  .hint { color: #666; font-size: 13px; }
  #val { font-variant-numeric: tabular-nums; font-weight: 700; }
  #preview { width: 100%; border-radius: 6px; background: #000; min-height: 120px; }
  button { padding: 8px 22px; border: 0; border-radius: 6px; background: #1a73e8; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { background: #bbb; }
  #status { margin-left: 10px; font-size: 14px; }
</style>
</head>
<body>
<h1>NE101 手动曝光调节</h1>

<div class="card">
  <label><input type="checkbox" id="manual"> 手动曝光模式(取消勾选 = 自动曝光)</label>

  <label>曝光量 <span id="val"></span></label>
  <input type="range" id="slider" min="0" max="1200" step="1" value="0" disabled>
  <div class="hint" id="hint"></div>

  <p><button id="save">保存并生效</button><span id="status"></span></p>
  <p class="hint">保存后配置会持久化到设备,深睡唤醒后仍生效。配合下方实时预览观察效果。</p>
</div>

<div class="card">
  <label>实时预览(MJPEG)</label>
  <img id="preview" alt="live view">
  <p class="hint">预览服务在 8080 端口;若无画面,先按一次设备拍照键唤醒相机。</p>
</div>

<script>
var $ = function (id) { return document.getElementById(id); };
var lineTimeUs = 0, maxAec = 1200;

function fmtMs(lines) {
  if (lineTimeUs <= 0) return '';
  var ms = lines * lineTimeUs / 1000;
  return ' ≈ ' + (ms >= 100 ? Math.round(ms) : ms.toFixed(1)) + ' ms';
}

function refresh() {
  var v = +$('slider').value;
  var manual = $('manual').checked;
  $('slider').disabled = !manual;
  $('val').textContent = v + ' 行' + fmtMs(v);
}

function load() {
  fetch('/api/v1/image/getCamParam').then(function (r) { return r.json(); }).then(function (cfg) {
    lineTimeUs = cfg.lineTimeUs || 0;
    maxAec = cfg.maxAecValue || 1200;
    $('slider').max = maxAec;
    $('manual').checked = !cfg.bAec;
    $('slider').value = Math.min(cfg.aecValue || 0, maxAec);
    $('hint').textContent = lineTimeUs > 0
      ? '当前分辨率:每行 ' + (lineTimeUs / 1000).toFixed(2) + ' ms,可调上限 ' + maxAec + ' 行' + fmtMs(maxAec)
      : '相机尚未初始化,毫秒换算暂不可用(按一次拍照键后刷新)';
    refresh();
  }).catch(function () { $('status').textContent = '读取配置失败'; });
}

$('save').onclick = function () {
  $('save').disabled = true;
  $('status').textContent = '保存中…';
  fetch('/api/v1/image/setCamParam', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ bAec: $('manual').checked ? 0 : 1, aecValue: +$('slider').value })
  }).then(function (r) { return r.json(); }).then(function (res) {
    $('status').textContent = res.result === 1000 ? '已保存 ✓' : '保存失败(result=' + res.result + ')';
  }).catch(function () { $('status').textContent = '保存失败(网络错误)'; })
    .finally(function () { $('save').disabled = false; });
};

$('slider').oninput = refresh;
$('manual').onchange = refresh;
$('preview').src = 'http://' + location.hostname + ':8080/api/v1/liveview/getJpegStream';
load();
</script>
</body>
</html>
